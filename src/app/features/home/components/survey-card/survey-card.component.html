<ng-template #content>
    <p class="card__category">{{ category() }}</p>
    <p class="card__title">{{ title() }}</p>

    <app-badge>{{ endDate() | endsIn }}</app-badge>
</ng-template>

@if (ended()) {
    <article class="ending-soon-card">
        <ng-container [ngTemplateOutlet]="content" />
    </article>
} @else {
    <a class="ending-soon-card" [routerLink]="['/survey', id()]">
        <ng-container [ngTemplateOutlet]="content" />
    </a>
}
