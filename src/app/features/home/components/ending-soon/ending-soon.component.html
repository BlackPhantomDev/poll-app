<h2>Your surveys</h2>

<p>Ending soon surveys</p>

@if (surveys().length > 0) {
    <div class="list">
        @for (survey of surveys(); track survey.id) {
            <app-survey-card variant="featured" [id]="survey.id" [category]="survey.category" [title]="survey.title" [endsIn]="survey.endsIn" />
        }
    </div>
} @else {
    <app-empty-state class="ending-soon__empty" message="No surveys ending soon." />
}
