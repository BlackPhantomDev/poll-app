<h2>Your surveys</h2>

<h3>Ending soon surveys</h3>

@if (loading()) {
    <app-loading-spinner class="ending-soon__state" label="Loading surveys …" />
} @else if (surveys().length > 0) {
    <div class="list">
        @for (survey of surveys(); track survey.id) {
            <app-survey-card variant="featured" [id]="survey.id" [category]="survey.category" [title]="survey.title" [endDate]="survey.endDate" />
        }
    </div>
} @else {
    <app-empty-state class="ending-soon__state" [message]="message()" />
}
