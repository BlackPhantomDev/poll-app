<div class="question" [formGroup]="group()">
    <div class="question__header">
        <h4 class="question__title">{{ index() + 1 }}. Question<span class="question__required" aria-hidden="true">*</span></h4>
        <app-icon-button label="Remove question" (click)="removed.emit()" />
    </div>

    <div class="question__field">
        <label class="question__text-label" [for]="textId()">Question {{ index() + 1 }} text</label>
        <input class="question__text" [id]="textId()" type="text" formControlName="text" [maxlength]="maxQuestion" aria-required="true" [attr.aria-invalid]="showError(text)" [attr.aria-describedby]="showError(text) ? textErrorId() : null" placeholder="Which date would work best for you?" />
        <div class="question__feedback">
            @if (showError(text)) {
                <p class="question__error" [id]="textErrorId()">Please enter the question.</p>
            }
            <app-char-counter [value]="text.value" [max]="maxQuestion" />
        </div>
    </div>

    <div class="question__answers">
        <span class="question__answers-label">Answers</span>
        <label class="question__multiple">
            <input type="checkbox" formControlName="allowMultiple" />
            Allow multiple answers.
        </label>
    </div>

    @for (option of options.controls; track option.controls.id.value) {
        <app-answer-option-editor
            [group]="option"
            [index]="$index"
            [submitted]="submitted()"
            (removed)="removeOption($index)" />
    }

    <app-button class="question__add" (click)="addOption()">
        <span class="question__add-label">Add answer</span>
        <svg class="question__add-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5"/>
            <path d="M9 5.5V12.5M5.5 9H12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
    </app-button>
</div>
