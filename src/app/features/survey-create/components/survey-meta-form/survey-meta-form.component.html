<div class="meta__primary">
    <div class="meta__field">
        <div class="meta__label-row">
            <label class="meta__label" [for]="titleId">Survey name<span class="meta__required" aria-hidden="true">*</span></label>
            <app-icon-button label="Clear survey name" (click)="clear('title')" />
        </div>
        <div class="meta__control">
            <input [id]="titleId" type="text" formControlName="title" [maxlength]="maxTitle" aria-required="true" [attr.aria-invalid]="showError(title)" [attr.aria-describedby]="showError(title) ? titleErrorId : null" />
        </div>
        <app-char-counter [value]="title.value" [max]="maxTitle" />
        @if (showError(title)) {
            <p class="meta__error" [id]="titleErrorId">Please enter a survey name.</p>
        }
    </div>

    <div class="meta__row">
        <div class="meta__field">
            <div class="meta__label-row">
                <label class="meta__label" [for]="endDateId">Set end date <span class="meta__hint">(optional)</span></label>
                <app-icon-button label="Clear end date" (click)="clear('endDate')" />
            </div>
            <div class="meta__control">
                <input [id]="endDateId" type="date" formControlName="endDate" [min]="today" [attr.aria-invalid]="showError(endDate)" [attr.aria-describedby]="showError(endDate) ? endDateErrorId : null" />
            </div>
            @if (showError(endDate)) {
                <p class="meta__error" [id]="endDateErrorId">The end date cannot be in the past.</p>
            }
        </div>
        <app-category-select />
    </div>
</div>

<div class="meta__field">
    <div class="meta__label-row">
        <label class="meta__label" for="survey-description">Describing text <span class="meta__hint">(optional)</span></label>
        <app-icon-button label="Clear describing text" (click)="clear('description')" />
    </div>
    <div class="meta__control meta__control--start">
        <textarea id="survey-description" formControlName="description" [maxlength]="maxDescription"></textarea>
    </div>
    <app-char-counter [value]="description.value" [max]="maxDescription" />
</div>
