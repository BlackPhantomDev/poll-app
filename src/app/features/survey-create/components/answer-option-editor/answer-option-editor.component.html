<div class="option" [formGroup]="group()">
    <div class="option__label-row">
        <span class="option__letter" aria-hidden="true">{{ index() | optionLetter }}.<span class="option__required">*</span></span>
        <label class="option__label" [for]="inputId()">Answer {{ index() | optionLetter }}</label>
        <app-icon-button label="Remove answer" (click)="removed.emit()" />
    </div>
    <input class="option__input" [id]="inputId()" type="text" formControlName="label" [maxlength]="maxOption" aria-required="true" [attr.aria-invalid]="showError(labelControl)" [attr.aria-describedby]="showError(labelControl) ? errorId() : null" />
    <div class="option__feedback">
        @if (showError(labelControl)) {
            <p class="option__error" [id]="errorId()">Please enter an answer.</p>
        }
        <app-char-counter [value]="labelControl.value" [max]="maxOption" />
    </div>
</div>
