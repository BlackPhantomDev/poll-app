<dialog #dialogEl (close)="closed.emit()" (cancel)="onCancel($event)">
    <form class="dialog-form" [formGroup]="form" (ngSubmit)="publish()">
        <header class="dialog-header">
            <div class="dialog-header__top">
                <app-badge>Draft</app-badge>
            </div>
            <div class="dialog-header__bottom">
                <h3 class="dialog-header__title">Create new survey</h3>
                <app-close-button class="dialog-header__close" label="Cancel" (click)="close()" />
            </div>
            <p class="dialog-header__legend" aria-hidden="true">
                <span class="dialog-header__legend-marker">*</span> Required field
            </p>
        </header>
        <main class="dialog-main">
            <div
                #scrollEl
                class="dialog-main__scroll"
                [class.dialog-main__scroll--scrollbar-hover]="scrollbarHover()"
                (mousemove)="updateScrollbarHover($event, scrollEl)"
                (mouseleave)="scrollbarHover.set(false)">
                <app-survey-meta-form class="dialog-main__meta" />

                <div class="dialog-main__questions">
                    @for (question of questions.controls; track question.controls.id.value) {
                        <app-question-editor
                            [group]="question"
                            [index]="$index"
                            (removed)="removeQuestion($index)" />
                    }
                    <app-button class="dialog-main__add-question" (click)="addQuestion()">
                        <span class="dialog-main__add-label">Add next question</span>
                        <svg class="dialog-main__add-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M10 6V14M6 10H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </app-button>
                </div>
            </div>
        </main>
        <footer class="dialog-footer">
            @if (publishError(); as text) {
                <p class="dialog-footer__error" role="alert">{{ text }}</p>
            }

            <app-button type="submit" [disabled]="form.invalid || publishing()">
                <span>Publish</span>
                <span class="dialog-footer__publish-icon" aria-hidden="true">
                    <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.1556 12.5078L16.0211 0.427617C16.2539 0.142539 16.5255 0 16.8359 0C17.1463 0 17.418 0.142539 17.6508 0.427617C17.8836 0.712695 18 1.05122 18 1.44321C18 1.83519 17.8836 2.17372 17.6508 2.4588L6.97045 15.5724C6.73763 15.8575 6.46602 16 6.1556 16C5.84518 16 5.57356 15.8575 5.34075 15.5724L0.335252 9.44321C0.102438 9.15813 -0.00911854 8.8196 0.000582034 8.42762C0.0102826 8.03563 0.13154 7.6971 0.364354 7.41203C0.597167 7.12695 0.873634 6.98441 1.19375 6.98441C1.51387 6.98441 1.79034 7.12695 2.02315 7.41203L6.1556 12.5078Z" fill="currentColor"/>
                    </svg>
                </span>
            </app-button>
        </footer>
    </form>

    <dialog #confirmEl class="confirm" aria-labelledby="confirm-title">
        <h4 class="confirm__title" id="confirm-title">Discard your survey?</h4>
        <p>Your questions and answers will be lost.</p>

        <div class="confirm__actions">
            <app-button class="confirm__discard" (click)="discard()">Discard</app-button>
            <app-button (click)="keepEditing()">Keep editing</app-button>
        </div>
    </dialog>
</dialog>
