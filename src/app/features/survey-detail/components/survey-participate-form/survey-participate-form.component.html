<div class="participate__questions">
    @for (question of questions(); track question.id) {
        <app-question-block
            [question]="question"
            [index]="$index"
            [selected]="selections()[question.id] ?? []"
            [disabled]="disabled()"
            (optionToggled)="toggleOption(question, $event)" />
    }
</div>

<div class="participate__footer">
    @if (notice(); as text) {
        <p class="participate__notice" role="status">{{ text }}</p>
    }

    <app-button
        class="participate__submit"
        [disabled]="disabled() || !complete()"
        (click)="submit()">
        Complete survey
    </app-button>
</div>
