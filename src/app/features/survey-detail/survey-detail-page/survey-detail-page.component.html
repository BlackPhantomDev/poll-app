<app-header variant="dark">
    <app-button class="detail__create" (click)="createOpen.set(true)">
        <span>Create survey</span>
        <app-add-icon class="detail__create-icon" />
    </app-button>
</app-header>

@if (createOpen()) {
    <app-survey-create-dialog (closed)="createOpen.set(false)" />
}

<main class="detail">
    @if (surveyResource.isLoading()) {
        <app-loading-spinner class="detail__state" label="Loading survey …" />
    } @else if (surveyResource.error()) {
        <div class="detail__state detail__error" role="alert">
            <h2>Survey could not be loaded.</h2>
            <app-button (click)="retry()">Try again</app-button>
        </div>
    } @else if (surveyResource.hasValue()) {
        <section class="detail__card">
            <app-survey-header [survey]="surveyResource.value()" />
            <app-survey-participate-form
                [questions]="surveyResource.value().questions"
                [disabled]="formDisabled()"
                [notice]="notice()"
                [error]="submitError()"
                (submitted)="submit($event)" />
        </section>

        <app-survey-results
            class="detail__results"
            [results]="results()"
            [error]="resultsError()" />
    }
</main>

<app-footer variant="dark" />
