<app-header variant="dark">
    <app-button class="detail__create" (click)="createOpen.set(true)">
        <span>Create survey</span>
        <app-add-icon class="detail__create-icon" />
    </app-button>
</app-header>

@if (createOpen()) {
    <app-survey-create-dialog (closed)="createOpen.set(false)" />
}

<main class="detail">
    @if (surveyResource.error()) {
        <h2 class="detail__state">Survey could not be loaded.</h2>
    } @else if (surveyResource.hasValue()) {
        <section class="detail__card">
            <app-survey-header [survey]="surveyResource.value()" />
            <app-survey-participate-form
                [questions]="surveyResource.value().questions"
                [disabled]="formDisabled()"
                (submitted)="submit($event)" />
        </section>

        <app-survey-results class="detail__results" [results]="results()" />
    } @else {
        <p class="detail__state">Loading survey …</p>
    }
</main>
