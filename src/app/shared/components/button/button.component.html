<ng-template #label><ng-content /></ng-template>

@if (link(); as target) {
  <a class="button" [routerLink]="target">
    <ng-container [ngTemplateOutlet]="label" />
  </a>
} @else {
  <button class="button" [type]="type()" [disabled]="disabled()">
    <ng-container [ngTemplateOutlet]="label" />
  </button>
}
